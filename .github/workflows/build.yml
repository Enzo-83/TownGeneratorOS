name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Pages allows one live deployment at a time. Queue rather than cancel: a
# half-finished deploy that gets cancelled leaves the site on the previous
# build, which is fine, but cancelling the *newer* one is not.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  html5:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # Pinned to match project.xml. The versions the upstream project pinned
      # (lime 7.3.0 / openfl 8.9.0) predate Haxe 4 and cannot compile on it.
      - name: Install haxelibs
        run: |
          haxelib install msignal 1.2.5 --always --quiet
          haxelib install lime 8.3.2 --always --quiet
          haxelib install openfl 9.5.2 --always --quiet
          haxelib run lime setup -y

      - name: Build html5
        run: haxelib run lime build html5

      - name: Check the bundle was produced
        run: test -s Export/html5/bin/TownGenerator.js

      - uses: actions/upload-artifact@v4
        with:
          name: town-generator-html5
          path: Export/html5/bin

      # Kept alongside the plain artifact above rather than replacing it, so a
      # failed deploy still leaves you a bundle to download.
      - name: Package for Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Export/html5/bin

  # Export/ is gitignored, so there is no branch for Pages to serve from — the
  # bundle only exists as something CI just built. Hence deploying from the
  # workflow rather than from a branch.
  #
  # ⚠️ This does nothing until Pages is turned on for the repository, under
  # Settings → Pages → Source: GitHub Actions. Until then the job fails with a
  # 404 from the Pages API; the build above is unaffected.
  deploy:
    needs: html5
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
